<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizmaster</title>
<meta name="description" content="Oefen je lesstof met quizzen en pak de highscore.">
<meta name="theme-color" content="#0D111B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quizmaster">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0D111B; --card:#161C2A; --card2:#1E2637; --text:#EEF2FF; --muted:#9AA4BF; --line:#2A3450; --soft:#222B3F;
  --hot:#FF6B1A; --cyan:#22D3EE; --a1:#F43F5E; --a2:#3B82F6; --a3:#16A34A; --a4:#9333EA; --orange:#F59E0B;
  --good:#22C55E; --bad:#F43F5E;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(255,107,26,.20), transparent 60%),
    radial-gradient(800px 480px at -10% 110%, rgba(34,211,238,.13), transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/32px 32px,
    var(--bg);
  background-attachment:fixed}
main{max-width:860px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;font-weight:700}
h1{font-size:clamp(2.3rem,7.5vw,3.6rem);letter-spacing:-.01em}
h2{font-size:2rem}
h3{font-size:1.3rem}
p{margin:.4em 0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid var(--line);border-radius:10px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;clip-path:var(--cut);background:var(--card2);
  box-shadow:inset 0 0 0 2px var(--line);padding:10px 18px;font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;min-height:46px;
  transition:transform .08s,filter .15s;text-decoration:none;color:var(--text)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.green{background:var(--hot);color:#160A02;box-shadow:none}
.btn.blue{background:var(--cyan);color:#04161A;box-shadow:none}
.btn.red{background:var(--a1);color:#fff;box-shadow:none}
.btn.purple{background:var(--a4);color:#fff;box-shadow:none}
.btn.big{font-size:1.3rem;padding:12px 26px}
.btn.link{clip-path:none;box-shadow:none;background:transparent;text-decoration:underline;min-height:38px;padding:4px 6px;font-family:var(--body);font-weight:500;font-size:1rem;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.note{border-left:4px solid var(--cyan);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0}
.note.err{border-left-color:var(--bad)} .note.ok{border-left-color:var(--good)} .note.warn{border-left-color:var(--orange)}
label.f{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;border:2px solid var(--line);border-radius:8px;background:#0F1420;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
textarea{min-height:80px;resize:vertical}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--text)}
.logo img{width:46px;height:46px;display:block}
.logo span{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav .btn{min-height:42px;padding:6px 14px;font-size:.98rem}

/* rang */
.rank{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rank .badge{font-family:var(--display);font-weight:700;font-size:1.15rem;background:var(--soft);padding:6px 14px;clip-path:var(--cut);box-shadow:inset 0 0 0 2px var(--hot);color:var(--hot)}
.xp{flex:1;min-width:200px;height:12px;background:#0F1420;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--orange))}

/* tegels */
.tile{--c:#3B82F6;position:relative;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:140px;border:0;clip-path:var(--cut);
  padding:18px;color:#fff;background:linear-gradient(145deg,var(--c) 0%,color-mix(in srgb,var(--c) 45%,#05070C) 100%);transition:transform .1s,filter .15s}
.tile::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px);pointer-events:none}
.tile:hover{transform:translateY(-3px);filter:brightness(1.1)}
.tile:active{transform:translateY(1px)}
.tile .emo{font-size:2.8rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.tile .ico{height:72px;width:auto;max-width:100%;display:block;align-self:flex-start;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.vakbadge{width:64px;height:64px;clip-path:var(--cut);display:grid;place-items:center;font-size:2.4rem;flex:none}
.vakbadge img{max-width:46px;max-height:52px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.icons button{position:relative;height:76px;border:0;clip-path:var(--cut);cursor:pointer;display:grid;place-items:center;font-size:2rem;color:#fff}
.icons button img{max-width:50px;max-height:58px}
.icons button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-6px}
.icons .ic{position:relative}
.icons .ic > button:first-child{width:100%}
.icons .ic .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:.85rem;font-weight:700;cursor:pointer;clip-path:none;display:grid;place-items:center;padding:0}
.icons .ic .x:hover{background:var(--bad);color:#fff}
.plaatjes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.plaatje{background:#0F1420;border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.plaatje .vb{width:100%;height:84px;display:grid;place-items:center;background:var(--soft);border-radius:8px}
.plaatje .vb img{max-width:70px;max-height:70px}
.plaatje .naam{font-size:.75rem;color:var(--muted);word-break:break-all}
.kleurkies{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kleurkies input[type=color]{width:56px;height:46px;border:2px solid var(--line);border-radius:8px;background:#0F1420;padding:2px;cursor:pointer}
.voorbeeld{width:220px}
.tile{container-type:inline-size}
.tile h3{margin-top:auto;font-size:clamp(.95rem,10.5cqw,1.45rem);line-height:1.1;overflow-wrap:anywhere;hyphens:auto;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile .small{opacity:.9}
.tile.add{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);align-items:center;justify-content:center;text-align:center}
.tile.add::after{display:none}
.topic{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--text);transition:border-color .15s,transform .1s}
.topic:hover{border-color:var(--hot);transform:translateY(-2px)}
.topic .emo{font-size:2.2rem;line-height:1}
.topic .best{margin-top:auto;font-family:var(--display);font-weight:700;color:var(--orange)}
.empty{text-align:center;padding:30px 20px}.empty .emo{font-size:3rem}

/* moeilijkheid */
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:600px){.diffs{grid-template-columns:1fr}}
.diff{cursor:pointer;text-align:left;border:0;clip-path:var(--cut);background:#0F1420;box-shadow:inset 0 0 0 2px var(--line);padding:14px;color:var(--text)}
.diff[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--hot);background:rgba(255,107,26,.12)}
.diff b{display:block;font-family:var(--display);font-size:1.3rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#0F1420;padding:8px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#04161A}

/* lijsten */
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;text-align:left;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{color:var(--hot);font-weight:600}
.clickrow{cursor:pointer}.clickrow:hover td{background:rgba(255,255,255,.03)}
.scroll{overflow-x:auto}
.medal{font-size:1.3rem}
.qitem{border-top:1px solid var(--line);padding:12px 0}
.qitem:first-child{border-top:0}
.opts{list-style:none;padding:0;margin:6px 0}
.opts li{padding:2px 0}
.opts li.ok{font-weight:600;color:var(--good)}
.tag{display:inline-block;border-radius:4px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-right:6px;background:var(--soft);border:1px solid var(--line)}
.tag.extra{background:var(--a4);border-color:var(--a4);color:#fff}
.tag.prop{background:var(--orange);border-color:var(--orange);color:#1A1002}
details{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.material{white-space:pre-wrap;max-height:360px;overflow:auto;margin-top:10px;font-size:.95rem}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--text)}
.pf{border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line);background:var(--card2)}
.speler{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.auth-tabs{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.auth-tabs button{flex:1;border:0;background:#0F1420;padding:10px;font-weight:600;cursor:pointer}
.auth-tabs button[aria-selected="true"]{background:var(--hot);color:#160A02}
.btabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:0;margin-bottom:18px}
.btabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-family:var(--display);font-weight:700;font-size:1.1rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.btabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--hot)}
.qrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .info{flex:1;min-width:200px}
.qrow .acties{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vakkop{display:flex;align-items:center;gap:10px;margin-top:8px}
.inv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.avatars button{font-size:1.7rem;height:52px;border:2px solid var(--line);border-radius:8px;background:#0F1420;cursor:pointer}
.avatars button[aria-pressed="true"]{border-color:var(--hot);background:rgba(255,107,26,.15)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:#0F1420;cursor:pointer}
.drop:hover{border-color:var(--cyan)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:var(--card)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-weight:700}
.loading{text-align:center;padding:40px 16px}
.spinner{width:56px;height:56px;margin:0 auto 18px;border:5px solid var(--line);border-top-color:var(--hot);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qr{background:#fff;border-radius:8px;padding:10px;width:220px;max-width:100%}
.code{font-family:ui-monospace,Consolas,monospace;word-break:break-all}

/* vraagsoorten */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border:2px dashed var(--line);border-radius:10px;margin-top:14px;align-items:center}
.chips.bank{border-style:solid;background:#0F1420}
.chip{border:0;clip-path:var(--cut);background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);padding:10px 14px;font-weight:600;font-size:1.08rem;cursor:pointer;color:var(--text)}
.chip.in{background:var(--cyan);color:#04161A;box-shadow:none}
.chips .leeg{color:var(--muted);font-size:.95rem}
.typ{margin-top:16px}
.typ input{font-size:1.4rem;font-weight:600;padding:14px 16px}
.accenten{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.accenten button{min-width:42px;height:42px;border:2px solid var(--line);border-radius:8px;background:#0F1420;font-size:1.15rem;cursor:pointer}
.koppel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.koppel .kol{display:flex;flex-direction:column;gap:10px}
.kp{border:0;clip-path:var(--cut);background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);padding:12px;font-weight:600;font-size:1.02rem;cursor:pointer;color:var(--text);text-align:left;min-height:52px}
.kp.sel{box-shadow:inset 0 0 0 3px #fff}
.kp.goed{outline:3px solid var(--good);outline-offset:-3px}
.kp.mis{outline:3px dashed var(--bad);outline-offset:-3px}
.typekeuze{display:flex;flex-wrap:wrap;gap:8px 16px}
.typekeuze label{display:flex;gap:8px;align-items:center;cursor:pointer}
.typekeuze input{width:20px;height:20px}

/* spelen */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:600;flex-wrap:wrap}
.pill{background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);clip-path:var(--cut);padding:4px 14px;font-family:var(--display);font-weight:700;font-size:1.15rem}
.timer{height:10px;background:#0F1420;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--cyan);width:100%}
.timer.low i{background:var(--bad)}
.qcard{text-align:center;padding:26px 20px}
.qcard .emo{font-size:3.2rem;line-height:1}
.qcard .qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4.4vw,2rem);line-height:1.2;margin-top:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:600px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:12px;text-align:left;border:0;clip-path:var(--cut);padding:14px 16px;font-weight:600;font-size:1.05rem;cursor:pointer;color:#fff;
  min-height:64px;transition:transform .08s,opacity .2s,filter .15s}
.ans:hover{filter:brightness(1.12)}
.ans:active{transform:translateY(2px)}
.ans .k{flex:none;width:34px;height:34px;border-radius:6px;background:rgba(0,0,0,.28);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.ans:nth-child(1){background:var(--a1)}.ans:nth-child(2){background:var(--a2)}.ans:nth-child(3){background:var(--a3)}.ans:nth-child(4){background:var(--a4)}
.answers.done .ans{cursor:default}.answers.done .ans.dim{opacity:.3}
.ans.right{box-shadow:inset 0 0 0 4px #fff}
.ans.wrong{opacity:.55;text-decoration:line-through}
.fb{margin-top:16px}.fb h3{font-size:1.7rem}.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.src{font-style:italic;color:var(--muted)}
.pop{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--orange)}
.result{text-align:center}
.result .score{font-family:var(--display);font-weight:700;font-size:clamp(4rem,17vw,7rem);line-height:1;color:var(--hot);text-shadow:0 0 32px rgba(255,107,26,.45)}
.record{display:inline-block;background:var(--hot);color:#160A02;clip-path:var(--cut);padding:6px 16px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.stars{font-size:2.5rem;letter-spacing:6px;color:var(--orange)}
.rv{border-top:1px solid var(--line);padding:12px 0;text-align:left}
.rv:first-child{border-top:0}
.rv .mark{font-size:1.2rem;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:2px solid var(--hot);border-radius:8px;padding:10px 16px;z-index:60;max-width:90vw}
.version{text-align:center;margin-top:36px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}.btn,.ans,.tile,.topic{transition:none}}
</style>
</head>
<body>

<main id="app" aria-live="polite"></main>
<script>
"use strict";
// null en false nooit als tekst tonen
{ const orig = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function(...n){ return orig.apply(this, n.filter(x => x != null && x !== false)); }; }
/* ============ instellingen ============ */
const VERSIE = "2026-11-11.14";
const SUPABASE_URL = "https://ojqqrfkmiptkdffynvvq.supabase.co";
const SUPABASE_KEY = "sb_publishable_8MeILxkBFHZCKs7ZOr_lXw_uXI4Dcv6";

const NIVEAUS = ["Groep 7–8", "Brugklas vmbo", "Havo/vwo 1", "Havo/vwo 2", "Havo/vwo 3"];

const AVATARS = ["🙂","😎","🤓","🦊","🐼","🐯","🦁","🐸","🐙","🦄","🐲","🚀","⚽","🎮","🎸","🌟","🍕","🏀","🦖","🐬"];
const STANDAARD = [["Aardrijkskunde","🌍","#0891B2"],["Wiskunde","📐","#3B82F6"],["Engels","💬","#E11D48"],["Frans","🥐","#9333EA"],["Geschiedenis","⚔️","#F59E0B"],["Biologie","🧬","#16A34A"]];
const VRAAGSOORTEN = { meerkeuze:"🔘 Meerkeuze", typen:"⌨️ Zelf typen (vertalen, invullen)", volgorde:"🧩 Zin bouwen", koppelen:"🔗 Koppelen" };
const TAALVAKKEN = ["Nederlands","Engels","Frans","Duits","Spaans"];
const ACCENTEN = { Frans:"é è ê ë à â ç î ï ô û ù œ", Spaans:"á é í ó ú ñ ü ¿ ¡", Duits:"ä ö ü ß", Nederlands:"é ë ï ö è" };
const TIJD_FACTOR = { meerkeuze:1, typen:1.6, volgorde:2, koppelen:2.5 };

const RANGEN = [[0,"🥚 Beginner"],[2000,"🔰 Rookie"],[6000,"⚔️ Strijder"],[15000,"🛡️ Pro"],[30000,"🔥 Expert"],[60000,"💎 Master"],[100000,"👑 Legend"]];
function rang(punten){
  let i = 0; while (i+1 < RANGEN.length && punten >= RANGEN[i+1][0]) i++;
  const [van, naam] = RANGEN[i], volgende = RANGEN[i+1];
  return { naam, volgende: volgende?.[1], nodig: volgende ? volgende[0] - punten : 0, deel: volgende ? (punten - van) / (volgende[0] - van) : 1 };
}
function rangBalk(punten){
  const r = rang(punten);
  return h("div",{class:"rank"}, h("span",{class:"badge"},r.naam),
    h("div",{class:"xp",role:"img","aria-label":`Voortgang naar volgende rang: ${Math.round(r.deel*100)}%`}, h("i",{style:`width:${Math.round(r.deel*100)}%`})),
    h("span",{class:"muted small"}, r.volgende ? `${nl(punten)} punten · nog ${nl(r.nodig)} tot ${r.volgende}` : `${nl(punten)} punten · hoogste rang!`));
}

const $app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
// Unieke naam voor een bestand; werkt ook zonder https (crypto.randomUUID kan dat niet)
function uniekId(){
  const b = new Uint8Array(16);
  if (window.crypto?.getRandomValues) crypto.getRandomValues(b); else for (let i=0;i<16;i++) b[i] = Math.random()*256|0;
  return Date.now().toString(36) + "-" + [...b].map(x => x.toString(16).padStart(2,"0")).join("");
}
const nl = n => Number(n||0).toLocaleString("nl-NL");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const datum = d => new Date(d).toLocaleDateString("nl-NL",{day:"numeric",month:"short"}) + " " + new Date(d).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
function toast(tekst){
  document.querySelector(".toast")?.remove();
  const t = h("div",{class:"toast",role:"status"},tekst); document.body.append(t);
  setTimeout(()=>t.remove(), 4000);
}
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
function render(...nodes){ stopTimer(); $app.replaceChildren(header(), ...nodes.filter(n => n != null && n !== false), h("p",{class:"version muted small"},"Versie " + VERSIE)); window.scrollTo(0,0); }

function viewLogin(modus = "login"){
  const tabs = h("div",{class:"auth-tabs",role:"tablist"},
    h("button",{role:"tab","aria-selected":String(modus==="login"),onclick:()=>viewLogin("login")},"Inloggen"),
    h("button",{role:"tab","aria-selected":String(modus==="nieuw"),onclick:()=>viewLogin("nieuw")},"Account maken"));
  const email = h("input",{type:"email",id:"em",autocomplete:"email",required:true});
  const ww = h("input",{type:"password",id:"pw",minlength:"8",autocomplete: modus==="login" ? "current-password" : "new-password",required:true});
  const naam = h("input",{type:"text",id:"an",maxlength:"36",autocomplete:"nickname",placeholder:"bijv. QuizKing"});
  const msg = h("div");
  const knop = h("button",{class:"btn green big",type:"submit"}, modus==="login" ? "Inloggen" : "Account maken");
  const form = h("form",{class:"card stack",onsubmit:async e=>{
    e.preventDefault(); msg.replaceChildren();
    const em = email.value.trim().toLowerCase();
    if (modus === "nieuw"){
      if (ww.value.length < 8) return msg.replaceChildren(h("p",{class:"note err"},"Kies een wachtwoord van minstens 8 tekens."));
      if (!naam.value.trim()) return msg.replaceChildren(h("p",{class:"note err"},"Kies een app-naam."));
    }
    knop.disabled = true;
    const res = modus === "login"
      ? await sb.auth.signInWithPassword({ email: em, password: ww.value })
      : await sb.auth.signUp({ email: em, password: ww.value, options: { data: { naam: naam.value.trim() } } });
    knop.disabled = false;
    if (res.error) return msg.replaceChildren(h("p",{class:"note err"}, authFout(res.error)));
    if (modus === "nieuw" && !res.data.session){ viewLogin("login"); toast("Account gemaakt. Log nu in."); }
  }},
    tabs,
    h("div",null,h("label",{class:"f",for:"em"},"E-mailadres"),email),
    h("div",null,h("label",{class:"f",for:"pw"},"Wachtwoord"),ww),
    modus === "nieuw" ? h("div",null,h("label",{class:"f",for:"an"},"App-naam (zo sta je op het scorebord)"),naam) : null,
    modus === "nieuw" ? h("p",{class:"muted small"},"Gebruik het e-mailadres waarop je bent uitgenodigd. Je wachtwoord moet minstens 8 tekens hebben.") : null,
    msg, knop,
    modus === "login" ? h("p",{class:"muted small"},"Wachtwoord vergeten? Vraag het aan de beheerder.") : null);
  $app.replaceChildren(header(), h("div",{class:"stack",style:"max-width:440px;margin:0 auto"},
    h("h1",null,"Level up je kennis."), h("p",{class:"muted"},"Log in, speel quizzen over je lesstof en pak de highscore. Een account maken kan alleen met een uitnodiging."), form),
    h("p",{class:"version muted small"},"Versie " + VERSIE));
}
function authFout(e){
  const m = e?.message || "";
  if (/database error|unexpected_failure|uitnodiging/i.test(m)) return "Dit e-mailadres is niet uitgenodigd. Vraag de beheerder om een uitnodiging, en gebruik precies het adres uit de uitnodiging.";
  if (/already registered|already been registered|already exists/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Kies Inloggen.";
  if (/invalid login credentials/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/signups not allowed|signup.*disabled/i.test(m)) return "Account maken staat nog uit. Vraag het aan de beheerder.";
  if (/email not confirmed/i.test(m)) return "Je e-mailadres is nog niet bevestigd.";
  if (/password/i.test(m)) return "Het wachtwoord moet minstens 8 tekens hebben.";
  return m || "Er ging iets mis. Probeer het opnieuw.";
}

/* ============ tweestapsverificatie ============ */
async function viewMfa(terug){
  laden("Even controleren…");
  const { data, error } = await sb.auth.mfa.listFactors();
  if (error) return render(h("p",{class:"note err"},fout(error)));
  const factor = data.totp?.[0];
  const code = h("input",{type:"text",inputmode:"numeric",autocomplete:"one-time-code",maxlength:"6",placeholder:"123456",id:"code"});
  const msg = h("div");
  async function verifieer(factorId){
    msg.replaceChildren();
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code: code.value.trim() });
    if (error) return msg.replaceChildren(h("p",{class:"note err"},"Die code klopt niet. Probeer de nieuwste code uit je app."));
    await leesAal(); await laadAlles(); go(terug || "#beheer");
  }
  if (factor){
    return render(h("div",{class:"card stack",style:"max-width:480px"},
      h("h2",null,"🔒 Beheer ontgrendelen"),
      h("p",null,"Vul de code van 6 cijfers in uit je authenticator-app (bijvoorbeeld Google Authenticator)."),
      h("div",null,h("label",{class:"f",for:"code"},"Code"),code), msg,
      h("button",{class:"btn green big",onclick:()=>verifieer(factor.id)},"Ontgrendelen")));
  }
  // Nog geen factor: eerst oude, niet afgemaakte pogingen opruimen, dan inschrijven
  for (const f of (data.all||[]).filter(f => f.status === "unverified")) await sb.auth.mfa.unenroll({ factorId: f.id });
  const { data: inschr, error: e2 } = await sb.auth.mfa.enroll({ factorType:"totp", friendlyName:"Quizmaster" });
  if (e2) return render(h("p",{class:"note err"},fout(e2)));
  render(h("div",{class:"card stack",style:"max-width:520px"},
    h("h2",null,"🔒 Tweestapsverificatie instellen"),
    h("p",null,"Beheerders loggen in met een extra code, net als bij de F1-poule. Scan deze QR-code met je authenticator-app."),
    h("img",{class:"qr",src:inschr.totp.qr_code,alt:"QR-code voor de authenticator-app"}),
    h("p",{class:"muted small"},"Lukt scannen niet? Voer deze sleutel handmatig in: ", h("span",{class:"code"},inschr.totp.secret)),
    h("div",null,h("label",{class:"f",for:"code"},"Code uit de app"),code), msg,
    h("button",{class:"btn green big",onclick:()=>verifieer(inschr.id)},"Bevestigen")));
}

// Maakt van een zwart-wit plaatje een wit icoon op een doorzichtige achtergrond (langste zijde 384, verhouding blijft)
async function maakIcoon(file){
  let bmp; try { bmp = await createImageBitmap(file); } catch { throw new Error("Dit plaatje kon niet worden gelezen. Gebruik png of jpg."); }
  const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
  const x = c.getContext("2d", { willReadFrequently:true }); x.drawImage(bmp,0,0);
  const img = x.getImageData(0,0,c.width,c.height), d = img.data;
  // Is het plaatje al (deels) doorzichtig? Dan bepaalt de doorzichtigheid de vorm, welke kleur het ook heeft.
  let doorzichtig = 0; for (let i=3;i<d.length;i+=4) if (d[i] < 250) doorzichtig++;
  const alVrijstaand = doorzichtig > d.length/4 * 0.05;
  let minX=c.width, minY=c.height, maxX=-1, maxY=-1;
  for (let i=0;i<d.length;i+=4){
    const L = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
    const a = alVrijstaand ? d[i+3] : Math.max(0, Math.min(255, (235 - L) * 255 / 175)) * d[i+3] / 255;
    d[i]=d[i+1]=d[i+2]=255; d[i+3]=a;
    if (a > 20){ const p=i/4, px=p%c.width, py=(p/c.width)|0; if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py; }
  }
  if (maxX < 0) throw new Error("Op dit plaatje is geen vorm te vinden. Gebruik een donker plaatje op een witte achtergrond, of een plaatje met een doorzichtige achtergrond.");
  x.putImageData(img,0,0);
  const w = maxX-minX+1, hgt = maxY-minY+1, s2 = 384 / Math.max(w,hgt);
  const o = document.createElement("canvas"); o.width = Math.max(1, Math.round(w*s2)); o.height = Math.max(1, Math.round(hgt*s2));
  o.getContext("2d").drawImage(c, minX, minY, w, hgt, 0, 0, o.width, o.height);
  return await new Promise((ok,nok) => o.toBlob(b => b ? ok(b) : nok(new Error("Omzetten mislukt")), "image/png"));
}

  } catch { throw new Error("Deze foto kon niet worden gelezen. Gebruik jpg of png."); }
}
async function roepFunctie(body){

/* ============ spelen ============ */
const TIMER = { raf:0 };
function stopTimer(){ cancelAnimationFrame(TIMER.raf); TIMER.raf = 0; }

async function startRonde(soort, id){
  laden("Quiz klaarzetten…");
  const d = gekozenDiff;
  const owIds = soort === "toets" ? toetsOnderwerpen(id) : [Number(id)];
  const titel = soort === "toets" ? toets(id)?.titel : onderwerp(id)?.titel;
  const nDoel = soort === "toets" ? TOETS_N[d] : DIFF[d].n;
  const { data: vragen, error } = await sb.from("vragen").select("id, onderwerp_id, type, vraag, opties, juist, uitleg, bron, emoji, moeilijkheid, soort, variant_van").in("onderwerp_id", owIds).eq("status","actief");
  if (error) return render(h("p",{class:"note err"},fout(error)));
  const ids = vragen.map(q => q.id);
  const { data: vg } = ids.length ? await sb.from("voortgang").select("vraag_id, keer_gezien, laatst_fout").eq("speler_id", S.user.id).in("vraag_id", ids) : { data:[] };
  const vgMap = new Map((vg||[]).map(x => [x.vraag_id, x]));
  // Een vraag en zijn varianten vormen één familie: per ronde komt er maximaal één uit elke familie.
  const families = new Map();
  for (const q of vragen){ const k = q.variant_van || q.id; if (!families.has(k)) families.set(k, []); families.get(k).push(q); }
  const levelBonus = { 1:{1:3,2:1,3:-5}, 2:{1:1,2:3,3:1}, 3:{1:-3,2:1,3:3} }[d];
  const kandidaten = [...families.values()].map(leden => {
    const gezien = leden.reduce((t,q)=>t+(vgMap.get(q.id)?.keer_gezien||0),0);
    const fout = leden.some(q => vgMap.get(q.id)?.laatst_fout);
    const q = leden.map(q => ({q, n:(vgMap.get(q.id)?.keer_gezien||0) + Math.random()*.5})).sort((a,b)=>a.n-b.n)[0].q;
    return { q, p: (gezien ? 0 : 3) + (fout ? 2.5 : 0) - Math.min(gezien,6)*0.3 + levelBonus[q.moeilijkheid] + Math.random()*2 };
  }).sort((a,b)=>b.p-a.p).map(x => x.q);
  const extra = d === 3 ? kandidaten.filter(q => q.soort === "extra") : [];
  const n = Math.min(nDoel, kandidaten.filter(q => q.soort === "boek").length + extra.length);
  const nExtra = Math.min(extra.length, Math.round(n/3));
  // boekvragen: om de beurt uit elk onderwerp, zodat alle stof aan bod komt
  const perOw = owIds.map(oid => kandidaten.filter(q => q.soort === "boek" && q.onderwerp_id == oid));
  const boek = [];
  for (let i = 0; boek.length < n - nExtra && perOw.some(l => l.length > i); i++)
    for (const l of shuffle(perOw)) if (l[i] && boek.length < n - nExtra) boek.push(l[i]);
  const keuze = [...extra.slice(0,nExtra), ...boek];
  if (keuze.length < n) keuze.push(...extra.slice(nExtra, nExtra + n - keuze.length));
  if (keuze.length < 4) return render(h("p",{class:"note warn"},"Er zijn nog te weinig vragen om te spelen."));
  const taal = vak((soort === "toets" ? toets(id) : onderwerp(id))?.vak_id)?.taal || null;

  let avatar = S.profiel.avatar;
  const naam = h("input",{type:"text",id:"pn",maxlength:"36",value:S.profiel.naam});
  const grid = h("div",{class:"avatars"});
  const teken = () => grid.replaceChildren(...AVATARS.map(a => h("button",{"aria-pressed":String(a===avatar),"aria-label":"Avatar "+a,onclick:()=>{avatar=a;teken();}},a)));
  teken();
  const fotoMsg = h("div");
  const kies = h("input",{type:"file",accept:"image/*",hidden:true,onchange:async e=>{
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    fotoMsg.replaceChildren(h("p",{class:"note"},"Foto uploaden…"));
    try {
      const blob = await vierkanteFoto(f);
      const pad = `${S.user.id}/${Date.now().toString(36)}.jpg`;
      const { error } = await sb.storage.from("avatars").upload(pad, blob, { contentType:"image/jpeg" });
      if (error) throw error;
      const oud = S.profiel.foto;
      const { error: e2 } = await sb.from("profielen").update({ foto: pad }).eq("id", S.user.id);
      if (e2) throw e2;
      if (oud) await sb.storage.from("avatars").remove([oud]);
      await laadAlles(); toast("Foto opgeslagen."); viewProfiel();
    } catch (err) { fotoMsg.replaceChildren(h("p",{class:"note err"},fout(err))); }
  }});
  render(h("div",{class:"stack",style:"max-width:560px"},
    h("h2",null,"Mijn profiel"),
    h("div",{class:"card stack"},
      h("h3",null,"Profielfoto"),
      h("div",{class:"row"}, poppetje(S.profiel, 96),
        h("div",{class:"stack"},
          h("button",{class:"btn blue",onclick:()=>kies.click()}, S.profiel.foto ? "📷 Andere foto" : "📷 Foto kiezen"),
          S.profiel.foto ? h("button",{class:"btn link",onclick:()=>verwijderFoto(S.profiel)},"Foto weghalen") : null)),
      kies, fotoMsg,
      h("p",{class:"muted small"},"Je foto staat met je app-naam op het scorebord. Heb je geen foto, dan zie je je emoji.")),
    h("div",{class:"card stack"},
      h("div",null,h("label",{class:"f",for:"pn"},"App-naam (zo sta je op het scorebord)"),naam),
      h("div",null,h("span",{style:"font-weight:600;display:block;margin-bottom:6px"},"Emoji (als je geen foto hebt)"),grid),
      h("button",{class:"btn green",onclick:async()=>{
        const n = naam.value.trim(); if (!n) return toast("Vul een app-naam in.");
        const { error } = await sb.from("profielen").update({ naam:n, avatar }).eq("id", S.user.id);
        if (error) return toast(/duplicate|unique/i.test(error.message) ? "Die app-naam is al in gebruik. Kies een andere." : fout(error));
        await laadAlles(); toast("Opgeslagen."); viewProfiel();
      }},"Opslaan"),
      h("p",{class:"muted small"},"De beheerder kan je app-naam aanpassen als dat nodig is.")),
    isBeheerderRol() ? h("p",{class:"muted small"}, isBeheerder() ? "Beheer is ontgrendeld met tweestapsverificatie." : "Je bent beheerder. Ontgrendel Beheer met je authenticator-app.") : null,
    h("button",{class:"btn",onclick:async()=>{ await sb.auth.signOut(); }},"Uitloggen")));
}
// Vierkante profielfoto van 320×320 (midden van de foto)
async function vierkanteFoto(file){
  let bmp; try { bmp = await createImageBitmap(file); } catch { throw new Error("Deze foto kon niet worden gelezen. Gebruik jpg of png."); }
  const z = Math.min(bmp.width, bmp.height), c = document.createElement("canvas"); c.width = c.height = 320;
  c.getContext("2d").drawImage(bmp, (bmp.width-z)/2, (bmp.height-z)/2, z, z, 0, 0, 320, 320);
  return await new Promise((ok,nok) => c.toBlob(b => b ? ok(b) : nok(new Error("Foto omzetten mislukt")), "image/jpeg", 0.85));
}

  const TABS = [["quizzen","🧩 Quizzen"],["vakken","📚 Vakken & icoontjes"],["gebruikers","👥 Gebruikers"]];

Groet,
${S.profiel?.naam || ""}`;
  location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(onderwerp)}&body=${encodeURIComponent(tekst)}`;

async function viewOverzichtSpeler(id){
  if (!isBeheerder()) return viewMfa(location.hash);
  const p = profiel(id); if (!p) return go("#overzicht");
  laden("Overzicht maken…");
  const [rq, vq] = await Promise.all([
    sb.from("rondes").select("onderwerp_id, toets_id, goed, totaal, gespeeld_op, antwoorden").eq("speler_id", id).order("gespeeld_op",{ascending:false}),
    sb.from("vragen").select("id, onderwerp_id, variant_van").eq("status","actief"),
  ]);
  if (rq.error) throw rq.error; if (vq.error) throw vq.error;
  // per onderwerp
  const perOw = new Map();
  const perVraag = new Map();
  for (const r of rq.data){
    const sleutel = r.toets_id ? "t" + r.toets_id : r.onderwerp_id;
    const x = perOw.get(sleutel) || { rondes:0, goed:0, tot:0, laatst:r.gespeeld_op, gezien:new Set() };
    x.rondes++; x.goed += r.goed; x.tot += r.totaal; perOw.set(sleutel, x);
    for (const a of r.antwoorden || []){
      x.gezien.add(a.v);
      const v = perVraag.get(a.v) || { tekst:a.q, emoji:a.e, ow:a.w || r.onderwerp_id, juist: a.g || a.o?.[a.r], n:0, fout:0, laatstFout:null };
      v.n++; if (!a.ok){ v.fout++; if (!v.laatstFout) v.laatstFout = a.t && a.t !== "meerkeuze" ? (a.in || "te laat") : a.c >= 0 ? a.o[a.c] : "te laat"; } perVraag.set(a.v, v);
    }
  }
  const families = new Map(); // onderwerp -> families (vraag + varianten tellen als één)
  for (const q of vq.data){ const k = q.variant_van || q.id; if (!families.has(q.onderwerp_id)) families.set(q.onderwerp_id, new Map()); const f = families.get(q.onderwerp_id); if (!f.has(k)) f.set(k, []); f.get(k).push(q.id); }
  // "nog nooit gehad" per onderwerp telt ook de vragen mee die in toetsen langskwamen
  const gezienOveral = new Set(); for (const x of perOw.values()) for (const v of x.gezien) gezienOveral.add(v);
  const owRijen = [...perOw.entries()].map(([k,x]) => {
    if (String(k).startsWith("t")){ const t = toets(String(k).slice(1)); return { o: t ? { emoji:t.emoji, titel:t.titel+" (eindtoets)", hash:"#toets/"+t.id } : null, ...x, nooit:null, fams:0 }; }
    const fam = families.get(k) || new Map();
    const nooit = [...fam.values()].filter(ids => !ids.some(i => gezienOveral.has(i))).length;
    const o = onderwerp(k);
    return { o: o ? { ...o, hash:"#onderwerp/"+o.id } : null, ...x, nooit, fams:fam.size };
  }).sort((a,b)=>b.rondes-a.rondes);
  const lijst = [...perVraag.values()];
  const moeilijk = lijst.filter(v => v.fout).sort((a,b)=> (b.fout/b.n - a.fout/a.n) || b.fout-a.fout).slice(0,15);
  const vaak = lijst.slice().sort((a,b)=>b.n-a.n).slice(0,15);
  const vraagTabel = (rows, kolom) => h("table",null,
    h("thead",null,h("tr",null,h("th",null,"Vraag"),h("th",{class:"num"},"Gehad"),h("th",{class:"num"},"Fout"))),
    h("tbody",null, rows.map(v => h("tr",null,
      h("td",null, h("div",null,(v.emoji||"")+" "+v.tekst), h("div",{class:"muted small"}, (onderwerp(v.ow)?.titel||"") + " · goed: " + (v.juist||"") + (kolom && v.laatstFout ? " · koos: " + v.laatstFout : ""))),
      h("td",{class:"num"},v.n+"×"), h("td",{class:"num"},v.fout+"×")))));
  const goed = rq.data.reduce((t,r)=>t+r.goed,0), tot = rq.data.reduce((t,r)=>t+r.totaal,0);
  render(h("div",{class:"stack"},
    h("div",{class:"row"}, poppetje(p, 64), h("div",null,h("h2",null,p.naam), h("div",{class:"muted"},`${rq.data.length} quizzen · ${nl(goed)} goed · ${nl(tot-goed)} fout · ${tot ? Math.round(goed/tot*100) : 0}% goed`))),
    h("div",{class:"card scroll"}, h("h3",null,"Per quiz"),
      owRijen.length ? h("table",null,
        h("thead",null,h("tr",null,h("th",null,"Quiz"),h("th",{class:"num"},"Quizzen"),h("th",{class:"num"},"Goed"),h("th",{class:"num"},"Fout"),h("th",{class:"num"},"% goed"),h("th",{class:"num"},"Nog nooit gehad"))),
        h("tbody",null, owRijen.map(x => h("tr",{class:"clickrow",onclick:()=>x.o && go(x.o.hash)},
          h("td",null,(x.o?.emoji||"")+" "+(x.o?.titel||"verwijderd")), h("td",{class:"num"},x.rondes), h("td",{class:"num"},x.goed), h("td",{class:"num"},x.tot-x.goed),
          h("td",{class:"num"},Math.round(x.goed/x.tot*100)+"%"), h("td",{class:"num"}, x.nooit == null ? "–" : `${x.nooit} van ${x.fams}`)))))
      : h("p",{class:"muted"},"Nog niet gespeeld.")),
    owRijen.some(x => x.fams && x.nooit/x.fams < .2) ? h("p",{class:"note warn"},"Bij sommige quizzen heeft deze speler bijna alle vragen al gehad. Maak daar meer vragen of een andere vraagstelling, zodat de quiz fris blijft.") : null,
    h("div",{class:"card scroll"}, h("h3",null,"❌ Gaan het vaakst fout"), moeilijk.length ? vraagTabel(moeilijk, true) : h("p",{class:"muted"},"Nog geen foute antwoorden.")),
    h("div",{class:"card scroll"}, h("h3",null,"🔁 Komen het vaakst terug"), vaak.length ? vraagTabel(vaak, false) : h("p",{class:"muted"},"Nog niets gespeeld.")),
    h("button",{class:"btn",onclick:()=>go("#beheer/gebruikers")},"Terug naar Gebruikers")));
}

/* ============ confetti ============ */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const kl = ["#FF7A6B","#4FB0FF","#36CF94","#A98BFF","#FFD23F"];
  const ps = Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*6+4,c:kl[Math.random()*5|0],a:Math.random()*6}));
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height);
    for (const p of ps){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=.2; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); x.restore(); }
    if (++t < 150) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* ============ start ============ */
async function sessie(session){
  S.user = session?.user || null;
  if (!S.user){ S.profiel = null; return route(); }
  laden("Laden…");
  try { await leesAal(); await laadAlles(); route(); }
  catch (e) { render(h("p",{class:"note err"},"Laden mislukt: " + fout(e)), h("button",{class:"btn",onclick:()=>location.reload()},"Opnieuw proberen")); }
}
let vorigeGebruiker;
sb.auth.onAuthStateChange((event, session) => {
  const id = session?.user?.id || null;
  if (event === "TOKEN_REFRESHED" || event === "MFA_CHALLENGE_VERIFIED") { S.user = session?.user || S.user; return; }
  if (id === vorigeGebruiker && event !== "SIGNED_OUT") return;
  vorigeGebruiker = id;
  setTimeout(() => sessie(session), 0);
});
</script>
