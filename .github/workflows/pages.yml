name: Site publiceren

on:
  # Bij elke upload naar de hoofdtak
  push:
    branches: [main]
  # Ook handmatig te starten via Actions > Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bestanden ophalen
        uses: actions/checkout@v4
      - name: Pages instellen
        uses: actions/configure-pages@v5
      - name: Site klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Site publiceren
        id: deploy
        uses: actions/deploy-pages@v4
