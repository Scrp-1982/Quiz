name: Supabase wakker houden

on:
  schedule:
    # Om de drie dagen om 06:00 UTC (dag 1, 4, 7, ... van de maand)
    - cron: '0 6 */3 * *'
  # Ook handmatig te starten via Actions > Run workflow
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database aanroepen
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
